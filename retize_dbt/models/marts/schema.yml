version: 2

models:
  - name: performance
    description: "Camada gold com deduplicacao em nivel de conteudo + plataforma."
    columns:
      - name: content_id
        description: "Identificador único do conteúdo na plataforma de origem."
        tests:
          - not_null
      - name: platform
        tests:
          - not_null
          - accepted_values:
              values: ['instagram', 'tiktok']
      - name: engagement_rate
        description: "Razão entre interações (likes + comentários) e alcance/visualizações. NULL quando reach e views são ambos 0 ou NULL."
      - name: day_of_week
        tests:
          - accepted_values:
              values: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday']
      - name: format
        tests:
          - not_null
  - name: sentiment
    description: "Camada gold de sentimento por conteudo e plataforma."
    columns:
      - name: content_id
        tests:
          - not_null
      - name: platform
        tests:
          - not_null
          - accepted_values:
              values: ['instagram', 'tiktok']
      - name: total_comments
        tests:
          - not_null
      - name: negative_comments
        tests:
          - not_null
      - name: negative_ratio
        description: "Proporção de comentários negativos sobre o total. NULL se total_comments = 0."

sources:
  - name: public
    schema: public
    tables:
      - name: raw_instagram_media
      - name: raw_instagram_media_insights
      - name: raw_instagram_comments
      - name: raw_tiktok_posts
      - name: raw_tiktok_comments
